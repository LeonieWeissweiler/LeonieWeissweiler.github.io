name: Update publications from Google Scholar

# Refreshes _data/publications.yml from Google Scholar.
#
# MANUAL ONLY. There used to be a weekly cron here; it ran twice and failed
# both times. Google Scholar serves a CAPTCHA to datacenter IP ranges and
# GitHub's runners sit squarely in those ranges, so the scrape cannot succeed
# from here — no amount of retrying or reworking the script changes that. The
# schedule was removed rather than left to send a failure mail every Monday.
#
# To refresh the list, run it yourself — from a normal connection it works
# fine, which is how the current data was generated:
#
#     python3 bin/update_publications.py
#
# then commit _data/publications.yml.
#
# Running it here via "Run workflow" is kept for the day the block lifts, or
# if the script is ever pointed at a source that datacenter IPs can reach. It
# will almost certainly fail today, and fails loudly without touching the
# committed data.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape Google Scholar
        run: python3 bin/update_publications.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/publications.yml; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git commit -m "Update publications from Google Scholar"
          git push
