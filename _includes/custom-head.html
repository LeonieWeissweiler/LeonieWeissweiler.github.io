<!-- Noto Serif is used only for the IPA transcription on the landing page.
     Neither Lora nor Bespoke Slab contains the IPA glyphs (ˈ ː ɪ ɐ and the
     combining breve U+032F), so those characters were being substituted from a
     system font mid-word and rendered at a visibly different size. Noto Serif
     is the one Google family whose subsets cover all of them, U+032F included. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400&display=swap">

<!-- Filename carries the mark's name rather than a generic "favicon", which also
     forces browsers past their (very sticky) cache of the previous icon. -->
<link rel="icon" href="{{ '/assets/img/favicon-ule.svg' | relative_url }}" type="image/svg+xml">
