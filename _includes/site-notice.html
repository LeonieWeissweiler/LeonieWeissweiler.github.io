<!-- ── TEMPORARY: Leipzig University outage ─────────────────────────────────
     Site-wide red banner, shown on every page because it concerns email
     rather than any one page's content.

     TO REMOVE once the university is back online: delete this file and the
     line in _layouts/default.html that includes it. Nothing else references
     it — the styles live here rather than in the theme so that deleting it
     leaves no orphans behind. (Writing that include tag out in full here
     would make Jekyll run it, and the file would include itself forever.)
     ────────────────────────────────────────────────────────────────────── -->
<style>
  /* Deliberately not themed: the palette has no red, and an alert should not
     look like part of the furniture. */

  /* Holds the card in the same column as the page content, and keeps it clear
     of the navbar — edge-to-edge with a bottom border read as part of the bar
     rather than as a notice sitting on the page. */
  .site-notice-wrap {
    max-width: 1100px;          /* matches .lion-page so it lines up with the content */
    margin: 0 auto;
    padding: 2.5rem 2.5rem 0;
  }

  /* Same shape as .lion-callout in work-with-me.html: tinted block, accent
     rule down the left edge. */
  .site-notice {
    background: #fbeae7;
    border-left: 3px solid #b3261e;
    padding: 1.1rem 1.4rem;
  }

  .site-notice-text {
    font-family: 'Lora', Georgia, serif;
    font-size: 0.92rem;
    line-height: 1.65;
    color: #6b201a;
    margin: 0;
  }

  .site-notice-text strong { color: #8c201a; }

  @media (max-width: 700px) {
    .site-notice-wrap {
      padding: 1.5rem 1.5rem 0;   /* follows .lion-page at this breakpoint */
    }
  }
</style>

<div class="site-notice-wrap">
  <div class="site-notice" role="status">
    <p class="site-notice-text">
      <strong>Leipzig University has been affected by a cyberattack.</strong>
      All university websites and services are down until further notice, which
      means I am currently unable to receive email at my university address.
    </p>
  </div>
</div>
