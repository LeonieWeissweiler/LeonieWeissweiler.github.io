<!-- Pointer to the lab site for anything a prospective student needs to act on.
     Used on both the landing page and /teaching, so it lives in one file. -->
<style>
  .lion-callout {
    background: var(--lion-bg-tint);
    border-left: 3px solid var(--lion-dark);
    padding: 1.1rem 1.4rem;
    /* stands on its own — no rules above or below, so it carries the spacing
       a .lion-divider would otherwise have provided */
    margin: 3.5rem 0;
  }

  .lion-callout p {
    font-family: 'Lora', Georgia, serif;
    font-size: 0.92rem;
    line-height: 1.7;
    color: var(--lion-body);
    margin: 0;
  }

  .lion-callout strong { color: var(--lion-ink); }

  .lion-callout a {
    color: var(--lion-dark);
    text-decoration: none;
    border-bottom: 1px solid var(--lion-dark);
    transition: opacity 0.2s;
  }

  .lion-callout a:hover { opacity: 0.7; }
</style>

<div class="lion-callout">
  <p>
    <strong>Interested in working with me?</strong> PhD positions, along with B.Sc. and M.Sc.
    thesis topics and the details of how to apply, are listed on the
    <a href="https://lionlabnlp.github.io/teaching" target="_blank" rel="noopener">LION Lab website</a>,
    where they are kept up to date.
  </p>
</div>
